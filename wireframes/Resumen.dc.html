<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #b2593c; } a:hover { color: #8e4430; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #fbfaf8; font-family: 'Space Grotesk', system-ui, sans-serif; color: #1c1b19; display: flex; flex-direction: column; overflow: hidden;">

  <div style="height: 52px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
    <span style="font-size: 12px; color: #9d9892; letter-spacing: 0.02em;">Empuje &middot; Gimnasio &middot; 47 min</span>
  </div>

  <div style="padding: 18px 24px 0; flex-shrink: 0;">
    <div style="width: 46px; height: 46px; border-radius: 999px; background: #1c1b19; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fbfaf8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
    </div>
    <div style="font-size: 28px; font-weight: 600; letter-spacing: -0.025em; margin-top: 14px; line-height: 1.15;">Entrenamiento<br>completado</div>
  </div>

  <div style="margin: 22px 20px 0; background: #f7eae4; border-radius: 18px; padding: 18px 20px; flex-shrink: 0;">
    <div style="font-size: 11px; color: #a8674e; letter-spacing: 0.06em; text-transform: uppercase;">Volumen total</div>
    <div style="display: flex; align-items: baseline; gap: 10px; margin-top: 6px;">
      <span style="font-size: 32px; font-weight: 700; letter-spacing: -0.03em; color: #6e3b28; font-variant-numeric: tabular-nums;">4.280</span>
      <span style="font-size: 15px; color: #a8674e;">kg</span>
      <span style="margin-left: auto; font-size: 14px; font-weight: 600; color: #6e3b28;">+12%</span>
    </div>

    <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 9px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 11px; color: #a8674e; width: 68px; flex-shrink: 0;">Sem. pasada</span>
        <div style="height: 9px; width: 60%; border-radius: 5px; background: #e2c3b5;"></div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 11px; color: #6e3b28; width: 68px; flex-shrink: 0; font-weight: 600;">Esta semana</span>
        <div style="height: 9px; width: 68%; border-radius: 5px; background: #b2593c;"></div>
      </div>
    </div>
  </div>

  <div style="margin: 12px 20px 0; background: #ffffff; border: 1px solid #e2ded7; border-radius: 18px; padding: 4px 20px; flex-shrink: 0;">

    <div style="display: flex; align-items: center; gap: 14px; height: 62px; border-bottom: 1px solid #f0ece5;">
      <div style="display: flex; gap: 4px; flex-shrink: 0;">
        <div style="width: 8px; height: 8px; border-radius: 999px; background: #1c1b19;"></div>
        <div style="width: 8px; height: 8px; border-radius: 999px; background: #1c1b19;"></div>
        <div style="width: 8px; height: 8px; border-radius: 999px; background: #1c1b19;"></div>
        <div style="width: 8px; height: 8px; border-radius: 999px; background: #1c1b19;"></div>
      </div>
      <span style="font-size: 14px; color: #1c1b19; text-wrap: pretty;">4 de 4 sesiones esta semana</span>
    </div>

    <div style="display: flex; align-items: center; gap: 14px; height: 66px;">
      <svg style="flex-shrink: 0;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b2593c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8v5a4 4 0 0 1-8 0z"/><path d="M8 5H5v1.5A3.5 3.5 0 0 0 8 10M16 5h3v1.5A3.5 3.5 0 0 1 16 10M10 12h4M12 12v4M9 21h6l-.7-3h-4.6z"/></svg>
      <span style="font-size: 14px; color: #1c1b19; line-height: 1.4; text-wrap: pretty;">Primera vez que completas <strong style="font-weight: 600;">3&times;10 en sentadilla</strong></span>
    </div>

  </div>

  <div style="margin: 24px 20px 0; flex-shrink: 0;">
    <div style="font-size: 14px; color: #6b6761; margin-bottom: 12px;">¿Cómo te sentiste?</div>
    <div style="display: flex; gap: 10px;">
      <div style="flex: 1; height: 62px; border: 1px solid #e2ded7; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: #ffffff;">
        <span style="font-size: 14px; color: #6b6761;">Fácil</span>
      </div>
      <div style="flex: 1; height: 62px; border: 1.5px solid #1c1b19; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: #ffffff;">
        <span style="font-size: 14px; font-weight: 600; color: #1c1b19;">Bien</span>
      </div>
      <div style="flex: 1; height: 62px; border: 1px solid #e2ded7; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: #ffffff;">
        <span style="font-size: 14px; color: #6b6761;">Duro</span>
      </div>
    </div>
  </div>

  <div style="flex: 1;"></div>

  <div style="margin: 0 20px 30px; height: 60px; border-radius: 14px; background: #1c1b19; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
    <span style="font-size: 17px; font-weight: 600; color: #fbfaf8; letter-spacing: -0.01em;">Listo</span>
  </div>

</div>
</x-dc>
</body>
</html>
