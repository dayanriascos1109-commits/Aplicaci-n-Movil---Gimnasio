<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #b2593c; } a:hover { color: #8e4430; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #fbfaf8; font-family: 'Space Grotesk', system-ui, sans-serif; color: #1c1b19; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 28px 20px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-shrink: 0;">
    <div>
      <div style="font-size: 13px; color: #9d9892;">Miércoles 12</div>
      <div style="font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin-top: 2px;">Hola, Dayan</div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; border: 1px solid #e2ded7; border-radius: 999px; height: 34px; padding: 0 12px; background: #ffffff;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b2593c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3c.5 3.5-2 4.5-2 7a3 3 0 0 0 6 0c0-1-.3-1.8-.7-2.5C18.5 9 20 11.3 20 14a8 8 0 0 1-16 0c0-4.5 3.5-7.5 9-11z"/></svg>
      <span style="font-size: 12px; font-weight: 500;">3 semanas</span>
    </div>
  </div>

  <div style="padding: 22px 20px 0; flex-shrink: 0;">
    <div style="display: flex; justify-content: space-between; gap: 6px;">

      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
        <span style="font-size: 11px; color: #9d9892;">L</span>
        <div style="width: 34px; height: 34px; border-radius: 999px; background: #1c1b19; display: flex; align-items: center; justify-content: center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fbfaf8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
        <span style="font-size: 11px; color: #9d9892;">M</span>
        <div style="width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center;">
          <div style="width: 10px; height: 1.5px; background: #cfcac2;"></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
        <span style="font-size: 11px; color: #b2593c; font-weight: 600;">X</span>
        <div style="width: 34px; height: 34px; border-radius: 999px; border: 2px solid #b2593c; display: flex; align-items: center; justify-content: center;">
          <div style="width: 7px; height: 7px; border-radius: 999px; background: #b2593c;"></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
        <span style="font-size: 11px; color: #9d9892;">J</span>
        <div style="width: 34px; height: 34px; border-radius: 999px; border: 1.5px solid #dedad3;"></div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
        <span style="font-size: 11px; color: #9d9892;">V</span>
        <div style="width: 34px; height: 34px; border-radius: 999px; border: 1.5px solid #dedad3;"></div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
        <span style="font-size: 11px; color: #9d9892;">S</span>
        <div style="width: 34px; height: 34px; border-radius: 999px; border: 1.5px solid #dedad3;"></div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
        <span style="font-size: 11px; color: #9d9892;">D</span>
        <div style="width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center;">
          <div style="width: 10px; height: 1.5px; background: #cfcac2;"></div>
        </div>
      </div>

    </div>
  </div>

  <div style="margin: 26px 20px 0; background: #ffffff; border: 1px solid #e2ded7; border-radius: 20px; padding: 20px; flex-shrink: 0;">
    <div style="font-size: 11px; color: #9d9892; letter-spacing: 0.06em; text-transform: uppercase;">Hoy</div>
    <div style="font-size: 28px; font-weight: 600; letter-spacing: -0.025em; margin-top: 6px; line-height: 1.1;">Empuje</div>
    <div style="font-size: 13px; color: #6b6761; margin-top: 6px;">45 min &middot; 5 ejercicios &middot; Pecho, hombro, tríceps</div>

    <div style="display: flex; gap: 5px; margin-top: 16px;">
      <div style="height: 5px; flex: 1; border-radius: 3px; background: #ece8e1;"></div>
      <div style="height: 5px; flex: 1; border-radius: 3px; background: #ece8e1;"></div>
      <div style="height: 5px; flex: 1; border-radius: 3px; background: #ece8e1;"></div>
      <div style="height: 5px; flex: 1; border-radius: 3px; background: #ece8e1;"></div>
      <div style="height: 5px; flex: 1; border-radius: 3px; background: #ece8e1;"></div>
    </div>

    <div style="margin-top: 18px; height: 58px; border-radius: 14px; background: #1c1b19; display: flex; align-items: center; justify-content: center; gap: 8px;">
      <span style="font-size: 17px; font-weight: 600; color: #fbfaf8; letter-spacing: -0.01em;">Entrenar</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fbfaf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </div>
  </div>

  <div style="margin: 14px 20px 0; background: #f7eae4; border-radius: 16px; padding: 16px 18px; flex-shrink: 0;">
    <div style="font-size: 14px; line-height: 1.45; color: #6e3b28; text-wrap: pretty;">La semana pasada completaste <strong style="font-weight: 600;">las 4 sesiones</strong>. No lo habías hecho antes.</div>
  </div>

  <div style="margin: 14px 20px 0; display: flex; align-items: center; gap: 10px; height: 52px; border: 1px solid #e2ded7; border-radius: 14px; padding: 0 16px; flex-shrink: 0;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b6761" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15a3 3 0 0 1-3 3H9l-5 3 1.2-3.6A3 3 0 0 1 4 15V7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3z"/></svg>
    <span style="font-size: 14px; color: #6b6761;">Preguntar al entrenador</span>
    <svg style="margin-left: auto;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b9b4ac" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </div>

  <div style="flex: 1;"></div>

  <div style="height: 78px; border-top: 1px solid #e8e4dd; display: flex; align-items: stretch; padding-bottom: 10px; flex-shrink: 0;">
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#1c1b19" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
      <span style="font-size: 11px; font-weight: 500; color: #1c1b19;">Inicio</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#a8a39c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span style="font-size: 11px; color: #a8a39c;">Plan</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#a8a39c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10M10 19V5M16 19v-6M22 19H2"/></svg>
      <span style="font-size: 11px; color: #a8a39c;">Progreso</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#a8a39c" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
      <span style="font-size: 11px; color: #a8a39c;">Perfil</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
