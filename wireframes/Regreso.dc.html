<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #b2593c; } a:hover { color: #8e4430; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #fbfaf8; font-family: 'Space Grotesk', system-ui, sans-serif; color: #1c1b19; display: flex; flex-direction: column; overflow: hidden; padding: 0 24px;">

  <div style="height: 108px; flex-shrink: 0;"></div>

  <div style="flex-shrink: 0;">
    <div style="font-size: 34px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.1;">Qué bueno<br>verte.</div>
    <div style="font-size: 16px; color: #6b6761; line-height: 1.5; margin-top: 16px; text-wrap: pretty;">Retomamos donde tiene sentido, no donde lo dejaste.</div>
  </div>

  <div style="margin-top: 22px; display: inline-flex; align-self: flex-start; align-items: center; gap: 8px; height: 36px; border: 1px solid #e2ded7; border-radius: 999px; padding: 0 14px; background: #ffffff; flex-shrink: 0;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9d9892" stroke-width="1.9" stroke-linecap="round"><path d="M9.5 8v8M14.5 8v8"/></svg>
    <span style="font-size: 12px; color: #6b6761;">Racha en pausa &middot; 3 semanas guardadas</span>
  </div>

  <div style="flex: 1;"></div>

  <div style="background: #ffffff; border: 1px solid #e2ded7; border-radius: 20px; padding: 22px 20px; flex-shrink: 0;">
    <div style="font-size: 11px; color: #a8674e; letter-spacing: 0.06em; text-transform: uppercase;">Sesión de reentrada</div>
    <div style="font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin-top: 8px; line-height: 1.15;">Cuerpo completo, suave</div>

    <div style="display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap;">
      <div style="border: 1px solid #e8e4dd; border-radius: 999px; height: 32px; display: flex; align-items: center; padding: 0 12px;">
        <span style="font-size: 12px; color: #6b6761;">20 min</span>
      </div>
      <div style="border: 1px solid #e8e4dd; border-radius: 999px; height: 32px; display: flex; align-items: center; padding: 0 12px;">
        <span style="font-size: 12px; color: #6b6761;">4 ejercicios</span>
      </div>
      <div style="border: 1px solid #e8e4dd; border-radius: 999px; height: 32px; display: flex; align-items: center; padding: 0 12px;">
        <span style="font-size: 12px; color: #6b6761;">Sin equipo</span>
      </div>
    </div>

    <div style="font-size: 13px; color: #6b6761; line-height: 1.5; margin-top: 16px; padding-top: 16px; border-top: 1px solid #f0ece5; text-wrap: pretty;">Más ligera que tu último entrenamiento. Hoy la meta es solo volver a moverte.</div>
  </div>

  <div style="margin-top: 16px; height: 60px; border-radius: 14px; background: #1c1b19; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
    <span style="font-size: 17px; font-weight: 600; color: #fbfaf8; letter-spacing: -0.01em;">Empezar</span>
  </div>

  <div style="height: 56px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
    <span style="font-size: 14px; color: #a8a39c;">Ahora no</span>
  </div>

  <div style="height: 24px; flex-shrink: 0;"></div>

</div>
</x-dc>
</body>
</html>
